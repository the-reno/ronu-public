name: Temporary Eris SOFR Fetch

on:
  push:
    paths:
      - '.github/workflows/_tmp_fetch_eris_sofr.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch daily 1M 3M 6M SOFR OIS
        shell: bash
        run: |
          mkdir -p tmp
          python - <<'PY'
          import csv, io, urllib.request
          from datetime import datetime

          url = 'https://files.erisfutures.com/ftp/Eris_Historical_ParCouponCurve_SOFR.csv'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              text = r.read().decode('utf-8-sig')

          out = []
          for row in csv.DictReader(io.StringIO(text)):
              raw_date = (row.get('Evaluation Date') or row.get('EvaluationDate') or '').strip()
              if not raw_date:
                  continue
              dt = None
              for fmt in ('%m/%d/%Y','%Y-%m-%d','%m/%d/%y'):
                  try:
                      dt = datetime.strptime(raw_date, fmt)
                      break
                  except ValueError:
                      pass
              if dt is None or dt < datetime(2022,1,1):
                  continue
              vals = [row.get('SOFR1M','').strip(), row.get('SOFR3M','').strip(), row.get('SOFR6M','').strip()]
              if all(vals):
                  out.append((dt, *vals))
          out.sort(key=lambda x: x[0])
          with open('tmp/_tmp_eris_sofr_daily.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(['Date','SOFR1M','SOFR3M','SOFR6M'])
              for dt,a,b,c in out:
                  w.writerow([dt.strftime('%Y-%m-%d'),a,b,c])
          print(f'wrote {len(out)} rows')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/_tmp_eris_sofr_daily.csv
          git commit -m 'Temporary Eris SOFR daily extraction' || true
          git push
