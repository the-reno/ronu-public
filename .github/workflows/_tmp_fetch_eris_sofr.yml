name: Temporary Eris SOFR Fetch

on:
  push:
    paths:
      - '.github/workflows/_tmp_fetch_eris_sofr.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print daily 1M 3M 6M SOFR OIS
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, urllib.request
          from datetime import datetime

          url = 'https://files.erisfutures.com/ftp/Eris_Historical_ParCouponCurve_SOFR.csv'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              text = r.read().decode('utf-8-sig')

          reader = csv.DictReader(io.StringIO(text))
          print('BEGIN_ERIS_DATA')
          print('Date,SOFR1M,SOFR3M,SOFR6M')
          n = 0
          for row in reader:
              raw_date = (row.get('Evaluation Date') or row.get('EvaluationDate') or '').strip()
              if not raw_date:
                  continue
              dt = None
              for fmt in ('%m/%d/%Y','%Y-%m-%d','%m/%d/%y'):
                  try:
                      dt = datetime.strptime(raw_date, fmt)
                      break
                  except ValueError:
                      pass
              if dt is None or dt < datetime(2022,1,1):
                  continue
              vals = [row.get('SOFR1M','').strip(), row.get('SOFR3M','').strip(), row.get('SOFR6M','').strip()]
              if not all(vals):
                  continue
              print(f'{dt:%Y-%m-%d},{vals[0]},{vals[1]},{vals[2]}')
              n += 1
          print(f'END_ERIS_DATA rows={n}')
          PY
